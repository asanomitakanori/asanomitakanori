name: Update development breakdown

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update WakaTime statistics
        if: ${{ env.WAKATIME_API_KEY != '' }}
        uses: athul/waka-readme@8991b596d85696d98ea96f775390a1bbe266c8c9
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: last_7_days
          LANG_COUNT: 10
          SHOW_TIME: true
